# pending changes of a crafted backup are dropped, other sections stay
boot: order=scsi0
cores: 1
memory: 512
name: crafted
scsi0: local:160/vm-160-disk-0.qcow2,size=4G
#qmdump#map:scsi0:drive-scsi0:local:qcow2:

[PENDING]
args: -device foo
delete: name
hostpci0: 0000:01:00.0

[snap]
cores: 2
memory: 512
snaptime: 1700000000
